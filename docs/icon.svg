<?xml version="1.0" encoding="UTF-8"?>
<!-- AlgoViz app icon — a 6-node graph (one node per sorting algorithm) on a
     dark gradient. HD/vector: scales to any size. The Android launcher uses the
     VectorDrawable adaptive icon in res/; this standalone SVG is for branding
     (README, store listing, etc.). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1B2740"/>
      <stop offset="60%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- edges: outer ring + central hub spokes -->
  <g stroke="url(#edge)" stroke-width="9" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M150,150 L350,134 L398,286 L292,398 L132,352 Z"/>
    <path d="M256,256 L150,150 M256,256 L398,286 M256,256 L132,352 M256,256 L350,134"/>
  </g>

  <!-- nodes (6 = the six sorts) -->
  <g filter="url(#glow)">
    <circle cx="150" cy="150" r="30" fill="#4FC3F7"/>
    <circle cx="350" cy="134" r="30" fill="#66E0A3"/>
    <circle cx="398" cy="286" r="30" fill="#B388FF"/>
    <circle cx="292" cy="398" r="30" fill="#FFD166"/>
    <circle cx="132" cy="352" r="30" fill="#FF6B6B"/>
    <circle cx="256" cy="256" r="36" fill="#FFFFFF"/>
  </g>
</svg>
